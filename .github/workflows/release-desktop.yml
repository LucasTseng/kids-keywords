name: Release Desktop

# 推送 v* 标签时构建 Windows / macOS 桌面包并附加到 GitHub Release；
# 也支持在 Actions 页面手动触发（仅产出构建构件，不发布 Release）。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build_cmd: pnpm app:win
            artifacts: release/*.exe
          - os: macos-latest
            build_cmd: pnpm app:mac
            artifacts: release/*.dmg

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build vocabulary and runtime assets
        run: pnpm build

      - name: Generate app icons
        run: pnpm icons

      - name: Package desktop app
        run: ${{ matrix.build_cmd }}

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ matrix.artifacts }}
          generate_release_notes: true
